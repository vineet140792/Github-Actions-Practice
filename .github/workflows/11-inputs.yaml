name: 11 - working with inputs

on: 
    workflow_dispatch: 
        inputs:
            dry-run:
                type: boolean
                description: Skip deployment and only print build inputs
                default: false
            target:
                type: environment
                description: which environment the workflow will target
            tag:
                type: choice
                options:
                    - v1
                    - v2
                    - v3
                default: v3
                description: Releases from which to build or deploy

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Build
              run: echo "Buildong from tag ${{inputs.tag}}"
    deploy:
        runs-on: ubuntu-latest
        if: ${{!inputs.dry-run}}
        environment: ${{inputs.target}}
        steps:
            - name: Deploy
              run: echo "Deploying to ${{inputs.target}}"