name: 04 - using Actions
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./04-using-actions/react-app
    steps:
        - name: Checkout Code
          uses: actions/checkout@v4
        - name: Setup node
          uses: actions/setup-node@v3
          with:
            node-version: '24.x'
        - name: install Dependencies
          run: npm ci
        - name: Run Unit Tests
          run: npm run test
    # 0.Checkout code from repositiory
    # 1. Install dependencides of our react appplication
    # 2. Execute automated tests