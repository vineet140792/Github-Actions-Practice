name: 09 - Using Functions

on:
    pull_request:
    workflow_dispatch:

jobs:
    echo1:
        runs-on: ubuntu-latest
        steps:
            - name: Print PR title
              run: echo "${{github.event.pull_request.title}}"
            - name: Print PR Labels
              run: |
                cat << EOF
                ${{toJson(github.event.pull_request.labels)}}
                EOF
            - name: Bug step
              if: ${{!cancelled() && contains(github.event.pull_request.title, 'fix')}}
              run: echo "Bug Fix"
            - name: Sleep 20 s
              run: sleep 20
            - name: Failing step
              run: exit 1
            - name: I will skipped
              if: ${{success()}}
              run: echo "I will print if succeed"
            - name: I will execute
              if: ${{failure()}}
              run: echo "I wil print if step fails"
            - name: I will execute
              if: ${{!cancelled()}}
              run: echo "I wil print if workflow is not cancelled"
            - name: I will execute when cancelled
              if: ${{cancelled()}}
              run: echo "I wil print if workflow is cancelled"