name: 13 - Caching

on:
    workflow_dispatch: 
        inputs:
            use-cache:
                description: Whether to execute cache step
                type: boolean
                default: true

jobs:
    build:
        runs-on: ubuntu-latest
        defaults:
          run:
            working-directory: ./13-caching/react-app
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            - name: Setup node
              uses: actions/setup-node@v3
              with:
                  node-version: "24.x"
            - name: Install dependencies
              run: npm ci
            - name: Testing
              run: npm run test
            - name: Building
              run: npm run build
        # 1. Checkout code
        # 2. Install Dependencies
        # 3. Unit test, building
        # 4. Deploy to a nonprod